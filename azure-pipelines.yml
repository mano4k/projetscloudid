trigger:
- main

pool:
  vmImage: 'windows-latest'

jobs:
- job: 'DeployVMJob'
  displayName: 'Deploy VM'
  steps:
  - task: UseDotNet@2
    displayName: 'Use .NET Core SDK'
    inputs:
      version: '3.x'
      installationPath: $(Agent.ToolsDirectory)/dotnet

  - task: AzureResourceManagerTemplateDeployment@3
    displayName: 'Deploy ARM Template'
    inputs:
      deploymentScope: 'Resource Group'
      action: 'Create Or Update Resource Group'
      resourceGroupName: 'testing'
      location: 'East US'  # Update with your desired location
      templateLocation: 'Inline'
      template: |
        {
          "$schema": "https://schema.management.azure.com/schemas/2015-01-01/deploymentTemplate.json#",
          "contentVersion": "1.0.0.0",
          "parameters": {
            "mes machinesName": {
              "type": "string",
              "minLength": 1
            },
            "storageType": {
              "type": "string",
              "defaultValue": "Standard_LRS",
              "allowedValues": [
                "Standard_LRS",
                "Standard_ZRS",
                "Standard_GRS",
                "Standard_RAGRS",
                "Premium_LRS"
              ]
            },
            "basedName": {
              "type": "string",
              "minLength": 1
            },
            "basedSku": {
              "type": "string",
              "allowedValues": [
                "Free",
                "Jupiter",
                "Saturn",
                "Venus"
              ],
              "defaultValue": "Free"
            }
          },
          "variables": {
            "projetvnetPrefix": "10.0.0.0/16",
            "projetvnetSubnet1Name": "Subnet-1",
            "projetvnetSubnet1Prefix": "10.0.0.0/24",
            "projetvnetSubnet2Name": "Subnet-2",
            "projetvnetSubnet2Prefix": "10.0.1.0/24",
            "storageName": "[concat('storage', uniqueString(resourceGroup().id))]"
          },
          "resources": [
           "name": "[parameters('mes machinesName')]",
      "type": "Microsoft.Compute/availabilitySets",
      "location": "[resourceGroup().location]",
      "apiVersion": "2015-06-15",
      "dependsOn": [ ],
      "tags": {
        "displayName": "mes machines"
      },
      "properties": {
        "platformUpdateDomainCount": 1,
        "platformFaultDomainCount": 1
      }
    },
    {
      "name": "projetvnet",
      "type": "Microsoft.Network/virtualNetworks",
      "location": "[resourceGroup().location]",
      "apiVersion": "2016-03-30",
      "dependsOn": [ ],
      "tags": {
        "displayName": "projetvnet"
      },
      "properties": {
        "addressSpace": {
          "addressPrefixes": [
            "[variables('projetvnetPrefix')]"
          ]
        },
        "subnets": [
          {
            "name": "[variables('projetvnetSubnet1Name')]",
            "properties": {
              "addressPrefix": "[variables('projetvnetSubnet1Prefix')]"
            }
          },
          {
            "name": "[variables('projetvnetSubnet2Name')]",
            "properties": {
              "addressPrefix": "[variables('projetvnetSubnet2Prefix')]"
            }
          }
        ]
      }
    },
    {
      "name": "[variables('storageName')]",
      "type": "Microsoft.Storage/storageAccounts",
      "location": "East US",
      "apiVersion": "2016-01-01",
      "sku": {
        "name": "[parameters('storageType')]"
      },
      "dependsOn": [ ],
      "tags": {
        "displayName": "storage"
      },
      "kind": "Storage"
    },
    {
      "name": "[parameters('basedName')]",
      "type": "SuccessBricks.ClearDB/databases",
      "location": "[resourceGroup().location]",
      "apiVersion": "2014-04-01",
      "plan": {
        "name": "[parameters('basedSku')]"
      },
      "dependsOn": [ ],
      "tags": {
        "provision_source": "RMS",
        "displayName": "based"
      }
          ],
          "outputs": {}
        }
      # Parameters for the ARM template
      overrideParameters: >
        -mes machinesName 'vm scal'
        -storageType 'Standard_LRS'
        -basedName 'baseUqac'
        -basedSku 'Free'
      deploymentMode: 'Incremental'
